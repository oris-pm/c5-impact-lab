<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RaizUp Cohort 5 - Impact Lab Groups</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');

    :root {
      --primary-cyan: #17C5E5;
      --cyan-light: #68EDEE;
      --navy-dark: #154EA1;
      --accent-orange: #FCC64C;
      --accent-red: #E03665;
      --accent-purple: #B78CF8;
      --dark-purple: #440999;
      --black: #000000;
      --bg-light: #F4F8FA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', 'Gotham', 'Gilmer', sans-serif;
      background-color: var(--bg-light);
      color: #333;
      padding: 40px 20px;
      min-height: 100vh;
    }

    /* Password Gate Screen */
    #pw-gate {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }

    .pw-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid #e1e9f0;
    }

    .pw-card h2 {
      font-size: 24px;
      font-weight: 800;
      color: var(--navy-dark);
      margin-bottom: 10px;
    }

    .pw-card p {
      font-size: 14px;
      color: #6b7c93;
      margin-bottom: 24px;
    }

    .pw-input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e1e9f0;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease;
      margin-bottom: 16px;
      text-align: center;
      letter-spacing: 1px;
    }

    .pw-input:focus {
      border-color: var(--primary-cyan);
    }

    .pw-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--navy-dark) 0%, #0d2f63 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .pw-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(21, 78, 161, 0.3);
    }

    #pw-error {
      color: var(--accent-red);
      font-size: 13px;
      font-weight: 700;
      margin-top: 12px;
      display: none;
    }

    /* Main Content Dashboard */
    #dashboard-content {
      display: none;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Header Styling */
    header {
      background: linear-gradient(135deg, var(--navy-dark) 0%, #0d2f63 100%);
      color: #ffffff;
      padding: 40px;
      border-radius: 16px;
      margin-bottom: 30px;
      box-shadow: 0 10px 25px rgba(23, 197, 229, 0.15);
      position: relative;
      overflow: hidden;
    }

    header::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, var(--accent-red), var(--accent-orange));
      opacity: 0.2;
      border-radius: 50%;
      filter: blur(50px);
    }

    .brand-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--cyan-light);
      font-weight: 700;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
    }

    header p {
      font-size: 15px;
      color: #d0e7ff;
      max-width: 650px;
      line-height: 1.5;
    }

    /* Group Stack */
    .groups-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Card Accordion Styling */
    .card {
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid #e1e9f0;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      transition: all 0.3s ease;
    }

    .card-header {
      padding: 20px 24px;
      background: var(--navy-dark);
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      gap: 15px;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .group-name {
      font-size: 22px;
      font-weight: 800;
      color: var(--cyan-light);
    }

    .toggle-icon {
      font-size: 18px;
      color: var(--cyan-light);
      transition: transform 0.3s ease;
      font-weight: 700;
    }

    .mentor-cta {
      background: linear-gradient(135deg, var(--accent-red) 0%, var(--accent-orange) 100%);
      color: #ffffff !important;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(224, 54, 101, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .mentor-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(224, 54, 101, 0.4);
    }

    .card-body {
      padding: 24px;
      display: block;
      transition: all 0.3s ease;
    }

    .card.collapsed .card-body {
      display: none;
    }

    .card.collapsed .toggle-icon {
      transform: rotate(-90deg);
    }

    .section-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      color: #8898aa;
      margin-bottom: 12px;
    }

    .delegate-list {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .delegate-item {
      padding: 12px 16px;
      background: #f8fafc;
      border: 1px solid #edf2f7;
      border-radius: 8px;
      font-weight: 700;
      color: var(--black);
      font-size: 15px;
    }

    /* Custom Header Accent Colors per Group */
    .card[data-group="A"] .mentor-cta { background: linear-gradient(135deg, #17C5E5, #154EA1); }
    .card[data-group="B"] .mentor-cta { background: linear-gradient(135deg, #E03665, #FCC64C); }
    .card[data-group="C"] .mentor-cta { background: linear-gradient(135deg, #440999, #B78CF8); }
